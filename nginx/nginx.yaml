apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: registry.access.redhat.com/ubi9/nginx-126:latest
          command: ["/bin/bash", "-ec"]
          args:
            - |
              cat > /tmp/nginx.conf <<'EOF'
              pid /tmp/nginx.pid;
              error_log /dev/stderr;
              events {}
              http {
                access_log /dev/stdout;
                server {
                  listen 8080;
                  location / {
                    default_type text/plain;
                    return 200 "Argo CD nginx CD test OK\n";
                  }
                }
              }
              EOF
              exec nginx -c /tmp/nginx.conf -g 'daemon off;'
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
spec:
  selector:
    app: nginx
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
